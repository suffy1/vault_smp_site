<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Listing | Vault SMP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');
        
        body { 
            font-family: 'Outfit', sans-serif; 
            background-color: #050505; 
            color: white; 
            overflow: hidden; /* Scroll kapalı */
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .glass {
            background: rgba(10, 10, 10, 0.75);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 80px rgba(0,0,0,0.95);
        }
        
        input, textarea {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #fff;
            padding: 12px 16px;
            border-radius: 10px;
            width: 100%;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 0.9rem;
            font-family: 'Outfit', sans-serif;
            font-weight: 400;
        }

        ::placeholder {
            font-family: 'Outfit', sans-serif;
            font-weight: 300;
            letter-spacing: 0.05em;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.8rem;
            text-transform: uppercase;
        }
        
        input:focus, textarea:focus {
            border-color: #10b981; 
            background: rgba(16, 185, 129, 0.05);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.15);
            transform: translateY(-1px);
        }

        label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 6px;
            display: block;
            font-weight: 700;
        }

        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
            background: radial-gradient(circle at center, #151515 0%, #000 100%);
        }
    </style>
</head>
<body class="relative">
    <canvas id="particle-canvas"></canvas>

    <nav class="absolute top-0 w-full px-10 py-8 flex justify-between items-center z-50 pointer-events-none">
        <div class="flex items-center space-x-3 pointer-events-auto">
            <div class="w-8 h-8 bg-white rounded-sm rotate-45 flex items-center justify-center">
                <i data-lucide="box" class="text-black w-4 h-4 -rotate-45"></i>
            </div>
            <span class="text-xl font-bold tracking-tighter uppercase">Vault.smp</span>
        </div>
        <a href="/" class="group flex items-center gap-2 text-[10px] font-bold uppercase tracking-[0.2em] text-white/40 hover:text-white transition pointer-events-auto">
            <span>Showroom</span>
            <i data-lucide="arrow-up-right" class="w-3 h-3 transition-transform group-hover:-translate-y-0.5 group-hover:translate-x-0.5"></i>
        </a>
    </nav>

    <div class="w-full h-full flex items-center justify-center relative z-10 px-4">
        <div id="form-card" class="glass w-full max-w-[600px] p-8 rounded-3xl relative opacity-0 translate-y-10 scale-95 overflow-hidden">
            
            <div class="absolute top-0 right-0 w-64 h-64 bg-emerald-500/10 rounded-full blur-[80px] -translate-y-1/2 translate-x-1/2 pointer-events-none"></div>

            <div class="mb-6 text-center">
                <h1 class="text-3xl font-bold tracking-tight mb-2 text-white">SUBMIT STASH</h1>
                <div class="w-12 h-0.5 bg-emerald-500/50 mx-auto rounded-full"></div>
            </div>

            <form id="sellForm" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div class="group">
                        <label>Identity</label>
                        <input type="text" id="seller" placeholder="Discord / IGN" required>
                    </div>
                    <div class="group">
                        <label>Valuation</label>
                        <input type="text" id="price" placeholder="Price ($)" required>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="group">
                        <label>Title</label>
                        <input type="text" id="title" placeholder="Stash Name" required>
                    </div>
                    <div class="group">
                        <label>Region</label>
                        <input type="text" id="region" placeholder="XYZ / Biome" required>
                    </div>
                </div>

                <div class="group">
                    <label>Security & Intel</label>
                    <div class="grid grid-cols-1 gap-3">
                         <input type="text" id="security" placeholder="Security Level (e.g. Obsidian Box)" required>
                         <textarea id="description" rows="2" placeholder="Detailed Manifest & Coords..." required class="resize-none"></textarea>
                    </div>
                </div>
                
                <div class="group">
                    <label>Evidence</label>
                    <textarea id="images" rows="3" placeholder="Imgur Links (One per line)" required class="resize-none font-mono text-xs text-emerald-400/80"></textarea>
                </div>

                <button type="submit" class="w-full bg-white hover:bg-emerald-400 text-black font-bold py-4 rounded-xl transition duration-500 flex items-center justify-center gap-2 uppercase tracking-[0.2em] text-[10px] mt-2 group overflow-hidden relative">
                    <span class="relative z-10">Initialize Upload</span>
                    <i data-lucide="arrow-right" class="w-3.5 h-3.5 relative z-10 group-hover:translate-x-1 transition-transform"></i>
                </button>
            </form>
        </div>
    </div>

    <script>
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();
        const masterGain = audioCtx.createGain();
        masterGain.gain.value = 0.15; 
        masterGain.connect(audioCtx.destination);

        function playHoverSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
            osc.connect(gain);
            gain.connect(masterGain);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        function playClickSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(masterGain);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        window.playSuccessSound = function() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(440, audioCtx.currentTime);
            gain1.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain1.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
            osc1.connect(gain1);
            gain1.connect(masterGain);
            osc1.start();
            osc1.stop(audioCtx.currentTime + 0.5);

            setTimeout(() => {
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(880, audioCtx.currentTime);
                gain2.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
                osc2.connect(gain2);
                gain2.connect(masterGain);
                osc2.start();
                osc2.stop(audioCtx.currentTime + 0.6);
            }, 150);
        };

        // Form logic
        lucide.createIcons();
        window.addEventListener('load', () => {
            gsap.to("#form-card", { duration: 1.2, opacity: 1, y: 0, scale: 1, ease: "expo.out", delay: 0.1 });
        });

        // Particles
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let mouse = { x: undefined, y: undefined };
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();
        window.addEventListener('mousemove', (e) => { mouse.x = e.x; mouse.y = e.y; });
        class Particle {
            constructor() { this.init(); }
            init() { this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height + canvas.height; this.size = Math.random() * 1.5; this.speedY = Math.random() * 0.5 + 0.1; this.opacity = Math.random() * 0.4 + 0.1; }
            draw() { ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); }
            update() { 
                this.y -= this.speedY; 
                if (mouse.x) { let dx = mouse.x - this.x; let dy = mouse.y - this.y; let dist = Math.sqrt(dx*dx + dy*dy); if (dist < 100) { this.x -= (dx/dist)*2; this.y -= (dy/dist)*2; } }
                if (this.y < 0) this.init(); 
            }
        }
        function initParticles() { particles = []; for (let i=0; i<80; i++) particles.push(new Particle()); }
        initParticles();
        function animate() { ctx.clearRect(0,0,canvas.width,canvas.height); particles.forEach(p => { p.draw(); p.update(); }); requestAnimationFrame(animate); }
        animate();

        // Submit Logic with Sound
        document.getElementById('sellForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerHTML;
            btn.innerHTML = 'ENCRYPTING...';
            btn.disabled = true;
            
            const rawImages = document.getElementById('images').value;
            const images = rawImages.split('\n').map(u => u.trim()).filter(u => u);
            
            const data = {
                seller: document.getElementById('seller').value,
                price: document.getElementById('price').value,
                title: document.getElementById('title').value,
                region: document.getElementById('region').value,
                security: document.getElementById('security').value,
                description: document.getElementById('description').value,
                images: images
            };

            try {
                const res = await fetch('/api/submit-stash', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data)
                });
                if(res.ok) {
                    playSuccessSound(); // BAŞARI SESİ
                    btn.classList.replace('bg-white', 'bg-emerald-500');
                    btn.classList.replace('text-black', 'text-white');
                    btn.innerHTML = 'UPLOAD COMPLETE';
                    setTimeout(() => { e.target.reset(); btn.classList.replace('bg-emerald-500', 'bg-white'); btn.classList.replace('text-white', 'text-black'); btn.innerHTML = originalText; btn.disabled = false; }, 2000);
                } else {
                    alert('Error'); btn.innerHTML = originalText; btn.disabled = false;
                }
            } catch(err) { btn.innerHTML = originalText; btn.disabled = false; }
        });

        // Add Sound Listeners
        document.addEventListener('DOMContentLoaded', () => {
            const interactables = document.querySelectorAll('button, a, input, textarea');
            interactables.forEach(el => {
                el.addEventListener('mouseenter', playHoverSound);
                if(el.tagName === 'BUTTON' || el.tagName === 'A') el.addEventListener('mousedown', playClickSound);
            });
        });
    </script>
</body>
</html>
