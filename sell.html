<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Listing | Vault SMP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        /* Modern Fontlar: Ana metin Outfit, Teknik yazılar Space Grotesk */
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Space+Grotesk:wght@300;400;500&display=swap');
        
        body { 
            font-family: 'Outfit', sans-serif; 
            background-color: #050505; 
            color: white; 
            overflow: hidden; /* Scroll tamamen kapatıldı */
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .glass {
            background: rgba(10, 10, 10, 0.7);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 80px rgba(0,0,0,0.9);
        }
        
        input, textarea {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #fff;
            padding: 12px 16px; /* Daha kompakt padding */
            border-radius: 10px;
            width: 100%;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 0.85rem;
            font-family: 'Space Grotesk', sans-serif; /* Yazarken modern teknik font */
        }

        /* Placeholder için özel stil */
        ::placeholder {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 300;
            letter-spacing: 0.05em;
            color: rgba(255, 255, 255, 0.25);
            font-size: 0.8rem;
        }
        
        input:focus, textarea:focus {
            border-color: #10b981; 
            background: rgba(16, 185, 129, 0.05);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.15);
            transform: translateY(-1px);
        }

        label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 6px;
            display: block;
            font-weight: 700;
        }

        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
            background: radial-gradient(circle at center, #151515 0%, #000 100%);
        }
    </style>
</head>
<body class="relative">
    <canvas id="particle-canvas"></canvas>

    <nav class="absolute top-0 w-full px-10 py-8 flex justify-between items-center z-50 pointer-events-none">
        <div class="flex items-center space-x-3 pointer-events-auto">
            <div class="w-7 h-7 bg-white rounded-sm rotate-45 flex items-center justify-center">
                <i data-lucide="box" class="text-black w-3.5 h-3.5 -rotate-45"></i>
            </div>
            <span class="text-lg font-bold tracking-tighter uppercase font-['Space_Grotesk']">Vault.smp</span>
        </div>
        <a href="/" class="group flex items-center gap-2 text-[10px] font-bold uppercase tracking-[0.2em] text-white/40 hover:text-white transition pointer-events-auto">
            <span>Showroom</span>
            <i data-lucide="arrow-up-right" class="w-3 h-3 transition-transform group-hover:-translate-y-0.5 group-hover:translate-x-0.5"></i>
        </a>
    </nav>

    <div class="w-full h-full flex items-center justify-center relative z-10 px-4">
        
        <div id="form-card" class="glass w-full max-w-[600px] p-8 rounded-3xl relative opacity-0 translate-y-10 scale-95 overflow-hidden">
            
            <div class="absolute top-0 right-0 w-64 h-64 bg-emerald-500/10 rounded-full blur-[80px] -translate-y-1/2 translate-x-1/2 pointer-events-none"></div>

            <div class="mb-6 text-center">
                <h1 class="text-3xl font-bold tracking-tight mb-2 text-white font-['Space_Grotesk']">SUBMIT STASH</h1>
                <div class="w-12 h-0.5 bg-emerald-500/50 mx-auto rounded-full"></div>
            </div>

            <form id="sellForm" class="space-y-5">
                <div class="grid grid-cols-2 gap-4">
                    <div class="group">
                        <label>Identity</label>
                        <input type="text" id="seller" placeholder="DISCORD / IGN" required>
                    </div>
                    <div class="group">
                        <label>Valuation</label>
                        <input type="text" id="price" placeholder="PRICE ($)" required>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="group">
                        <label>Title</label>
                        <input type="text" id="title" placeholder="STASH NAME" required>
                    </div>
                    <div class="group">
                        <label>Region</label>
                        <input type="text" id="region" placeholder="XYZ / BIOME" required>
                    </div>
                </div>

                <div class="group">
                    <label>Security & Intel</label>
                    <div class="grid grid-cols-1 gap-3">
                         <input type="text" id="security" placeholder="SECURITY LEVEL (e.g. OBSIDIAN BOX)" required>
                         <textarea id="description" rows="3" placeholder="DETAILED MANIFEST & COORDS..." required class="resize-none"></textarea>
                    </div>
                </div>
                
                <div class="group">
                    <label>Evidence</label>
                    <input type="text" id="images" placeholder="IMGUR LINKS (Space separated)" required>
                </div>

                <button type="submit" class="w-full bg-white hover:bg-emerald-400 text-black font-bold py-4 rounded-xl transition duration-500 flex items-center justify-center gap-2 uppercase tracking-[0.2em] text-[10px] mt-2 group overflow-hidden relative font-['Space_Grotesk']">
                    <span class="relative z-10">Initialize Upload</span>
                    <i data-lucide="arrow-right" class="w-3.5 h-3.5 relative z-10 group-hover:translate-x-1 transition-transform"></i>
                </button>
            </form>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // 1. ANİMASYON: Giriş
        window.addEventListener('load', () => {
            gsap.to("#form-card", {
                duration: 1.2,
                opacity: 1,
                y: 0,
                scale: 1,
                ease: "expo.out",
                delay: 0.1
            });
        });

        // 2. PARTİKÜL SİSTEMİ
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let mouse = { x: undefined, y: undefined };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
        });

        class Particle {
            constructor() {
                this.init();
            }
            init() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height + canvas.height;
                this.size = Math.random() * 1.5;
                this.speedY = Math.random() * 0.5 + 0.1;
                this.opacity = Math.random() * 0.4 + 0.1;
            }
            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
            update() {
                this.y -= this.speedY;
                
                // Mouse Kaçış Efekti
                if (mouse.x) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < 100) {
                        this.x -= (dx/dist) * 2;
                        this.y -= (dy/dist) * 2;
                    }
                }

                if (this.y < 0) this.init();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < 80; i++) particles.push(new Particle());
        }
        initParticles();

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.draw(); p.update(); });
            requestAnimationFrame(animate);
        }
        animate();

        // FORM SUBMIT
        document.getElementById('sellForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerHTML;
            btn.innerHTML = 'ENCRYPTING...';
            btn.disabled = true;

            // Image input'u boşluklara veya yeni satıra göre böl
            const rawImages = document.getElementById('images').value;
            const images = rawImages.split(/[\s,]+/).filter(u => u); // Virgül veya boşlukla ayır
            
            const data = {
                seller: document.getElementById('seller').value,
                price: document.getElementById('price').value,
                title: document.getElementById('title').value,
                region: document.getElementById('region').value,
                security: document.getElementById('security').value,
                description: document.getElementById('description').value,
                images: images
            };

            try {
                const res = await fetch('/api/submit-stash', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if(res.ok) {
                    btn.classList.replace('bg-white', 'bg-emerald-500');
                    btn.classList.replace('text-black', 'text-white');
                    btn.innerHTML = 'UPLOAD COMPLETE';
                    setTimeout(() => {
                         e.target.reset();
                         btn.classList.replace('bg-emerald-500', 'bg-white');
                         btn.classList.replace('text-white', 'text-black');
                         btn.innerHTML = originalText;
                         btn.disabled = false;
                    }, 2000);
                } else {
                    alert('Error');
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            } catch(err) { 
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
