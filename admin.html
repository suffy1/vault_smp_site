<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault Admin | Secure Database</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body { font-family: 'Inter', sans-serif; background-color: #09090b; color: #e4e4e7; overflow-x: hidden; }
        
        /* LOGIN EKRANI */
        #login-screen { position: fixed; inset: 0; z-index: 9999; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .login-box { width: 100%; max-width: 320px; text-align: center; }
        
        /* ANA PANEL (Gizli) */
        #admin-panel { display: none; }
        
        /* SIDEBAR & LAYOUT */
        .sidebar { width: 250px; height: 100vh; position: fixed; left: 0; top: 0; background: #000; border-right: 1px solid #27272a; padding: 24px; display: flex; flex-direction: column; }
        .main-content { margin-left: 250px; padding: 40px; width: calc(100% - 250px); }
        
        /* COMPONENTS */
        .btn-primary { background: #fff; color: #000; padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 0.85rem; transition: 0.2s; cursor: pointer; }
        .btn-primary:hover { background: #d4d4d8; }
        
        /* TABLE */
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { color: #71717a; font-size: 0.75rem; text-transform: uppercase; padding: 12px 16px; border-bottom: 1px solid #27272a; }
        td { padding: 16px; border-bottom: 1px solid #18181b; color: #d4d4d8; font-size: 0.9rem; }
        tr:hover td { background: #18181b; }
        
        /* FORM ELEMENTS */
        input, textarea { width: 100%; background: #18181b; border: 1px solid #27272a; color: #fff; padding: 10px 12px; border-radius: 6px; font-size: 0.9rem; outline: none; transition: 0.2s; }
        input:focus, textarea:focus { border-color: #10b981; }
        label { display: block; font-size: 0.75rem; color: #71717a; margin-bottom: 6px; font-weight: 600; letter-spacing: 0.05em; }

        /* MODAL */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; display: none; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .modal-content { background: #09090b; border: 1px solid #27272a; width: 600px; max-height: 90vh; overflow-y: auto; padding: 32px; border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }

        /* CUSTOM DROPDOWN */
        .custom-select-wrapper { position: relative; user-select: none; }
        .custom-select-trigger { background: #18181b; border: 1px solid #27272a; color: #fff; padding: 10px 12px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; }
        .custom-options { position: absolute; top: 105%; left: 0; width: 100%; background: #18181b; border: 1px solid #27272a; border-radius: 6px; overflow: hidden; opacity: 0; visibility: hidden; pointer-events: none; transform: translateY(-5px); transition: 0.2s; z-index: 50; }
        .custom-select-wrapper.open .custom-options { opacity: 1; visibility: visible; pointer-events: auto; transform: translateY(0); }
        .custom-option { padding: 10px 12px; cursor: pointer; transition: 0.1s; font-size: 0.9rem; }
        .custom-option:hover { background: #27272a; color: #fff; }
        .custom-option.selected { color: #10b981; }

        /* IMAGE PREVIEW */
        .preview-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 10px; }
        .preview-item { position: relative; aspect-ratio: 1; background: #18181b; border-radius: 6px; overflow: hidden; border: 1px solid #27272a; }
        .preview-item img { width: 100%; height: 100%; object-fit: cover; }
        .btn-remove-img { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; background: rgba(0,0,0,0.8); color: #ef4444; border-radius: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 10px; transition: 0.2s; }
        .btn-remove-img:hover { background: #ef4444; color: white; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <div class="flex justify-center mb-6"><i data-lucide="shield-lock" class="w-12 h-12 text-white"></i></div>
            <h2 class="text-xl font-bold text-white mb-2">Vault Admin Access</h2>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <input type="password" id="admin-pass" placeholder="Database Key" class="text-center">
                <button type="submit" id="login-btn" class="btn-primary w-full py-3">Login</button>
            </form>
            <p id="login-error" class="text-red-500 text-xs mt-4 hidden">Access Denied.</p>
        </div>
    </div>

    <div id="admin-panel">
        <aside class="sidebar">
            <div class="flex items-center gap-3 mb-8 px-2">
                <i data-lucide="database" class="w-5 h-5 text-emerald-500"></i>
                <span class="font-bold tracking-tight text-white">VAULT DB</span>
            </div>
            <div class="flex items-center gap-3 padding-3 text-white/50 text-sm"><i data-lucide="layout-list" class="w-4 h-4"></i> Listings</div>
            <div class="mt-auto text-red-400 cursor-pointer text-sm" onclick="location.reload()"><i data-lucide="log-out" class="w-4 h-4 inline mr-2"></i> Logout</div>
        </aside>

        <main class="main-content">
            <div class="flex justify-between items-center mb-8">
                <h1 class="text-2xl font-bold text-white">Database Listings</h1>
                <button onclick="openModal()" class="btn-primary flex items-center gap-2"><i data-lucide="plus" class="w-4 h-4"></i> Add Official Stash</button>
            </div>

            <div class="border border-zinc-800 rounded-xl overflow-hidden">
                <table>
                    <thead>
                        <tr>
                            <th>Title</th><th>Seller</th><th>Region</th><th>Price</th><th>Status</th><th class="text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody id="inventory-list">
                        <tr><td colspan="6" class="text-center py-8 text-zinc-500">Waiting for database connection...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <div id="modal" class="modal-overlay">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-lg font-bold text-white">New Database Entry</h2>
                <button onclick="closeModal()" class="text-zinc-500 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>

            <form id="adminForm" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div><label>Seller</label><input type="text" id="seller" value="VaultSMP" required></div>
                    <div><label>Price</label><input type="text" id="price" placeholder="$..." required></div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div><label>Title</label><input type="text" id="title" required></div>
                    <div>
                        <label>Server Region</label>
                        <div class="custom-select-wrapper">
                            <div class="custom-select-trigger"><span>Select...</span> <i data-lucide="chevron-down" class="w-4 h-4"></i></div>
                            <div class="custom-options">
                                <div class="custom-option" data-value="NA West">NA West</div>
                                <div class="custom-option" data-value="NA East">NA East</div>
                                <div class="custom-option" data-value="EU Central">EU Central</div>
                                <div class="custom-option" data-value="EU East">EU East</div>
                                <div class="custom-option" data-value="Asia">Asia</div>
                                <div class="custom-option" data-value="Oceania">Oceania</div>
                            </div>
                            <input type="hidden" id="region" required>
                        </div>
                    </div>
                </div>
                <div><label>Description</label><textarea id="description" rows="3" required></textarea></div>
                <div>
                    <label>Images (Imgur Links)</label>
                    <textarea id="images" rows="2" class="font-mono text-xs text-emerald-500/80"></textarea>
                    <div id="preview-area" class="preview-grid"></div>
                </div>
                <button type="submit" class="btn-primary w-full py-3 mt-4">Save to Database</button>
            </form>
        </div>
    </div>

    <script>
        // --- 1. LOGIN & FETCH ---
        async function handleLogin(e) {
            e.preventDefault();
            const pass = document.getElementById('admin-pass').value;
            const btn = document.getElementById('login-btn');
            const error = document.getElementById('login-error');

            btn.innerHTML = "Checking...";
            btn.disabled = true;

            try {
                // NETLIFY FUNCTION'A SORUYORUZ
                const res = await fetch('/api/admin-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: pass })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    // Giriş Başarılı
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('admin-panel').style.display = 'block';
                    loadDatabase(); // Verileri Çek
                } else {
                    // Hatalı Şifre
                    error.classList.remove('hidden');
                    error.innerText = "Invalid Password.";
                    btn.innerHTML = "Login";
                    btn.disabled = false;
                }
            } catch (err) {
                error.classList.remove('hidden');
                error.innerText = "Server connection error.";
                btn.innerHTML = "Login";
                btn.disabled = false;
            }
        }

        // --- 2. LOAD DATA FROM DB ---
        async function loadDatabase() {
            const list = document.getElementById('inventory-list');
            try {
                // Burada senin veritabanından veri çeken fonksiyonunu çağırıyoruz
                const res = await fetch('/api/stashes'); 
                const data = await res.json();

                if (data.length === 0) {
                    list.innerHTML = '<tr><td colspan="6" class="text-center py-8 text-zinc-500">Database is empty.</td></tr>';
                    return;
                }

                list.innerHTML = data.map(item => `
                    <tr class="border-b border-zinc-800 last:border-0">
                        <td class="font-medium text-white">${item.title}</td>
                        <td class="text-zinc-400">${item.seller}</td>
                        <td><span class="bg-zinc-800 text-zinc-300 px-2 py-1 rounded text-xs border border-zinc-700">${item.region || 'Unknown'}</span></td>
                        <td class="font-mono text-emerald-400">${item.price}</td>
                        <td>
                            <div class="flex items-center text-xs font-medium ${getStatusColor(item.status)}">
                                <span class="status-dot ${getDotColor(item.status)}"></span>
                                ${item.status}
                            </div>
                        </td>
                        <td class="text-right">
                            <button class="p-2 hover:text-white text-zinc-500 transition"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </td>
                    </tr>
                `).join('');
                lucide.createIcons();
            } catch (err) {
                list.innerHTML = '<tr><td colspan="6" class="text-center py-8 text-red-500">Failed to load data.</td></tr>';
            }
        }

        function getStatusColor(status) {
            if (status === 'Active' || status === 'Available') return 'text-green-400';
            if (status === 'Pending') return 'text-yellow-400';
            return 'text-red-400';
        }
        function getDotColor(status) {
            if (status === 'Active' || status === 'Available') return 'bg-green-500';
            if (status === 'Pending') return 'bg-yellow-500';
            return 'bg-red-500';
        }

        // --- 3. SUBMIT NEW STASH (ADMIN) ---
        document.getElementById('adminForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.innerText = "Saving...";
            
            // Verileri topla
            const rawImages = document.getElementById('images').value;
            const images = rawImages.split('\n').map(u => u.trim()).filter(u => u);
            
            const postData = {
                seller: document.getElementById('seller').value,
                price: document.getElementById('price').value,
                title: document.getElementById('title').value,
                region: document.getElementById('region').value,
                description: document.getElementById('description').value,
                images: images,
                status: 'Available' // Admin eklediği için direkt yayında
            };

            try {
                // ADMIN ADD ENDPOINT (bunu netlify/functions altında oluşturmalısın)
                const res = await fetch('/api/admin-add-official', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(postData)
                });

                if (res.ok) {
                    closeModal();
                    loadDatabase(); // Listeyi yenile
                    e.target.reset();
                    document.getElementById('preview-area').innerHTML = '';
                } else {
                    alert("Error saving stash.");
                }
            } catch (err) {
                alert("Connection failed.");
            } finally {
                btn.innerText = originalText;
            }
        });

        // --- 4. UI LOGIC (Dropdown & Images) ---
        const dropdownWrapper = document.querySelector('.custom-select-wrapper');
        const dropdownTrigger = document.querySelector('.custom-select-trigger');
        const dropdownOptions = document.querySelectorAll('.custom-option');
        const dropdownInput = document.getElementById('region');

        dropdownTrigger.addEventListener('click', () => dropdownWrapper.classList.toggle('open'));
        dropdownOptions.forEach(option => {
            option.addEventListener('click', () => {
                dropdownTrigger.querySelector('span').innerText = option.innerText;
                dropdownInput.value = option.getAttribute('data-value');
                dropdownWrapper.classList.remove('open');
                dropdownOptions.forEach(o => o.classList.remove('selected'));
                option.classList.add('selected');
            });
        });

        const imgInput = document.getElementById('images');
        const previewArea = document.getElementById('preview-area');
        imgInput.addEventListener('input', updatePreviews);

        function updatePreviews() {
            const urls = imgInput.value.split('\n').filter(url => url.trim() !== '');
            previewArea.innerHTML = '';
            urls.forEach((url, index) => {
                const div = document.createElement('div');
                div.className = 'preview-item';
                div.innerHTML = `<img src="${url}" onerror="this.style.display='none'"><div class="btn-remove-img" onclick="removeImage(${index})">✕</div>`;
                previewArea.appendChild(div);
            });
        }

        window.removeImage = function(index) {
            const urls = imgInput.value.split('\n');
            urls.splice(index, 1);
            imgInput.value = urls.join('\n');
            updatePreviews();
        }

        function openModal() { document.getElementById('modal').style.display = 'flex'; }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        lucide.createIcons();
    </script>
</body>
</html>
