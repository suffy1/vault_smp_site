<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault Admin | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #050505; color: white; }
    </style>
</head>
<body class="p-10">
    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-10">
            <h1 class="text-3xl font-bold flex items-center gap-2"><i data-lucide="shield"></i> ADMIN DASHBOARD</h1>
            <div class="flex gap-2">
                <input type="password" id="adminPass" placeholder="Password" class="bg-zinc-800 p-2 rounded text-white border border-zinc-700">
                <button onclick="loadDashboard()" class="bg-emerald-500 text-black px-4 py-2 rounded font-bold">Refresh</button>
            </div>
        </div>

        <h2 class="text-amber-400 font-bold tracking-widest text-sm mb-4 uppercase">Pending Approvals</h2>
        <div id="pending-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-12">
            </div>

        <h2 class="text-emerald-400 font-bold tracking-widest text-sm mb-4 uppercase">Active Listings</h2>
        <div id="active-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            </div>
    </div>

    <script>
        lucide.createIcons();

        async function loadDashboard() {
            const pass = document.getElementById('adminPass').value;
            if(!pass) return alert("Şifre girin!");

            const res = await fetch('/api/admin-get', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pass })
            });

            if(!res.ok) return alert("Yetkisiz Giriş!");
            const data = await res.json();

            renderList(data.filter(i => i.status === 'Pending'), 'pending-grid', true);
            renderList(data.filter(i => i.status !== 'Pending'), 'active-grid', false);
        }

        function renderList(items, elementId, isPending) {
            const container = document.getElementById(elementId);
            container.innerHTML = items.map(item => `
                <div class="bg-zinc-900 border border-zinc-800 p-4 rounded-xl relative group">
                    <img src="${item.images[0]}" class="w-full h-32 object-cover rounded-lg mb-4 opacity-50">
                    <h3 class="font-bold text-lg">${item.title}</h3>
                    <div class="text-xs text-zinc-400 mb-2">${item.seller} • ${item.price}</div>
                    
                    <div class="flex gap-2 mt-4">
                        ${isPending ? `
                            <button onclick="updateStatus(${item.id}, 'Available')" class="bg-emerald-500/20 text-emerald-400 w-full py-2 rounded text-xs font-bold hover:bg-emerald-500 hover:text-black transition">APPROVE</button>
                        ` : `
                            <button onclick="updateStatus(${item.id}, 'Sold')" class="bg-blue-500/20 text-blue-400 w-full py-2 rounded text-xs font-bold hover:bg-blue-500 hover:text-black transition">MARK SOLD</button>
                        `}
                        <button onclick="deleteStash(${item.id})" class="bg-red-500/20 text-red-400 px-4 py-2 rounded text-xs font-bold hover:bg-red-500 hover:text-black transition"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        async function updateStatus(id, status) {
            const pass = document.getElementById('adminPass').value;
            await fetch('/api/admin-update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pass, id, action: 'update', status })
            });
            loadDashboard();
        }

        async function deleteStash(id) {
            if(!confirm('Silmek istediğine emin misin?')) return;
            const pass = document.getElementById('adminPass').value;
            await fetch('/api/admin-update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pass, id, action: 'delete' })
            });
            loadDashboard();
        }
    </script>
</body>
</html>
