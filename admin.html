<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault Command | Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #0c0c0c; color: white; }
        .glass-panel { background: #111; border: 1px solid #333; }
        input, textarea, select { background: #000; border: 1px solid #333; color: white; padding: 10px; width: 100%; border-radius: 6px; }
        .tab-active { border-bottom: 2px solid #34d399; color: #34d399; }
    </style>
</head>
<body class="p-6">
    
    <div class="max-w-7xl mx-auto">
        <div class="flex justify-between items-center mb-8 border-b border-white/10 pb-4">
            <h1 class="text-2xl font-bold flex items-center gap-2"><i data-lucide="shield-alert" class="text-emerald-500"></i> COMMAND CENTER</h1>
            <div class="flex gap-2">
                <input type="password" id="adminPass" placeholder="Admin Password" class="w-48">
                <button onclick="loadDashboard()" class="bg-white text-black px-4 py-2 rounded font-bold hover:bg-emerald-400 transition">LOGIN / REFRESH</button>
            </div>
        </div>

        <div class="flex space-x-6 mb-6 text-sm font-bold uppercase tracking-widest text-white/40">
            <button onclick="switchTab('manage')" id="tab-manage" class="pb-2 tab-active transition">Manage Listings</button>
            <button onclick="switchTab('add')" id="tab-add" class="pb-2 transition hover:text-white">Add Official Stash</button>
        </div>

        <div id="view-manage" class="block">
            <div class="mb-12">
                <h2 class="text-amber-400 font-bold text-xs tracking-[0.2em] mb-4 uppercase flex items-center gap-2"><i data-lucide="clock"></i> Pending Approval</h2>
                <div id="pending-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
            </div>

            <div>
                <h2 class="text-emerald-400 font-bold text-xs tracking-[0.2em] mb-4 uppercase flex items-center gap-2"><i data-lucide="check-circle"></i> Active Database</h2>
                <div id="active-grid" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
            </div>
        </div>

        <div id="view-add" class="hidden max-w-2xl">
            <div class="glass-panel p-8 rounded-2xl">
                <h2 class="text-xl font-bold mb-6 text-emerald-400">CREATE OFFICIAL LISTING</h2>
                <form id="addOfficialForm" class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <input type="text" id="off-title" placeholder="Title" required>
                        <input type="text" id="off-price" placeholder="Price" required>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <input type="text" id="off-region" placeholder="Region" required>
                        <input type="text" id="off-security" placeholder="Security" required>
                    </div>
                    <textarea id="off-desc" rows="3" placeholder="Description" required></textarea>
                    <textarea id="off-images" rows="3" placeholder="Image URLs (One per line)" required class="font-mono text-xs text-emerald-400"></textarea>
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 py-3 rounded font-bold">PUBLISH IMMEDIATELY</button>
                </form>
            </div>
        </div>
    </div>

    <div id="editModal" class="fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-[#111] w-full max-w-2xl p-6 rounded-2xl border border-white/10 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold">EDIT LISTING</h2>
                <button onclick="closeEditModal()" class="text-white/50 hover:text-white"><i data-lucide="x"></i></button>
            </div>
            
            <form id="editForm" class="space-y-4">
                <input type="hidden" id="edit-id">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs text-white/50 block mb-1">Title</label>
                        <input type="text" id="edit-title">
                    </div>
                    <div>
                        <label class="text-xs text-white/50 block mb-1">Price</label>
                        <input type="text" id="edit-price">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs text-white/50 block mb-1">Seller</label>
                        <input type="text" id="edit-seller">
                    </div>
                    <div>
                        <label class="text-xs text-white/50 block mb-1">Status</label>
                        <select id="edit-status">
                            <option value="Pending">Pending</option>
                            <option value="Available">Available</option>
                            <option value="Sold">Sold</option>
                        </select>
                    </div>
                </div>
                <textarea id="edit-desc" rows="3"></textarea>
                
                <div>
                    <label class="text-xs text-white/50 block mb-1">Images (One per line)</label>
                    <textarea id="edit-images" rows="4" class="font-mono text-xs"></textarea>
                </div>

                <div class="flex gap-2 pt-4 border-t border-white/10">
                    <button type="button" onclick="deleteStash()" class="bg-red-900/50 text-red-400 px-4 py-3 rounded font-bold hover:bg-red-900 flex-1">DELETE</button>
                    <button type="submit" class="bg-emerald-600 text-white px-4 py-3 rounded font-bold hover:bg-emerald-500 flex-[2]">SAVE CHANGES</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        lucide.createIcons();

        function switchTab(tab) {
            document.getElementById('view-manage').classList.add('hidden');
            document.getElementById('view-add').classList.add('hidden');
            document.getElementById('tab-manage').classList.remove('tab-active', 'text-emerald-400', 'border-emerald-400');
            document.getElementById('tab-add').classList.remove('tab-active', 'text-emerald-400', 'border-emerald-400');
            
            document.getElementById('view-' + tab).classList.remove('hidden');
            document.getElementById('tab-' + tab).classList.add('tab-active');
        }

        async function loadDashboard() {
            const pass = document.getElementById('adminPass').value;
            if(!pass) return alert("Enter Password");

            try {
                const res = await fetch('/api/admin-get', {
                    method: 'POST', body: JSON.stringify({ password: pass })
                });
                if(!res.ok) throw new Error("Unauthorized");
                const data = await res.json();
                
                renderList(data.filter(i => i.status === 'Pending'), 'pending-grid', true);
                renderList(data.filter(i => i.status !== 'Pending'), 'active-grid', false);
            } catch(e) { alert(e.message); }
        }

        function renderList(items, elemId, isPending) {
            const container = document.getElementById(elemId);
            container.innerHTML = items.map(item => `
                <div onclick='openEditModal(${JSON.stringify(item).replace(/'/g, "&#39;")})' class="bg-[#151515] hover:bg-[#222] border border-white/5 p-3 rounded-lg cursor-pointer transition group">
                    <div class="flex gap-3">
                        <img src="${item.images[0] || ''}" class="w-16 h-16 object-cover rounded bg-black">
                        <div>
                            <h3 class="font-bold text-sm text-white group-hover:text-emerald-400 transition">${item.title}</h3>
                            <p class="text-xs text-white/50">${item.seller} • ${item.price}</p>
                            <span class="text-[10px] uppercase font-bold ${item.status === 'Available' ? 'text-emerald-500' : (item.status === 'Pending' ? 'text-amber-500' : 'text-red-500')}">${item.status}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // EDIT MODAL LOGIC
        function openEditModal(item) {
            document.getElementById('edit-id').value = item.id;
            document.getElementById('edit-title').value = item.title;
            document.getElementById('edit-price').value = item.price;
            document.getElementById('edit-seller').value = item.seller;
            document.getElementById('edit-status').value = item.status;
            document.getElementById('edit-desc').value = item.description;
            document.getElementById('edit-images').value = Array.isArray(item.images) ? item.images.join('\n') : item.images;
            
            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        // SAVE EDIT
        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const pass = document.getElementById('adminPass').value;
            const id = document.getElementById('edit-id').value;
            
            const data = {
                id: id,
                title: document.getElementById('edit-title').value,
                price: document.getElementById('edit-price').value,
                seller: document.getElementById('edit-seller').value,
                status: document.getElementById('edit-status').value,
                description: document.getElementById('edit-desc').value,
                images: document.getElementById('edit-images').value.split('\n').map(x => x.trim()).filter(x => x)
            };

            await fetch('/api/admin-edit', {
                method: 'POST',
                body: JSON.stringify({ password: pass, action: 'update', data: data })
            });
            closeEditModal();
            loadDashboard();
        });

        // DELETE
        async function deleteStash() {
            if(!confirm("DELETE THIS STASH?")) return;
            const pass = document.getElementById('adminPass').value;
            const id = document.getElementById('edit-id').value;

            await fetch('/api/admin-edit', {
                method: 'POST',
                body: JSON.stringify({ password: pass, action: 'delete', id: id })
            });
            closeEditModal();
            loadDashboard();
        }

        // ADD OFFICIAL
        document.getElementById('addOfficialForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const pass = document.getElementById('adminPass').value;
            
            const data = {
                title: document.getElementById('off-title').value,
                price: document.getElementById('off-price').value,
                region: document.getElementById('off-region').value,
                security: document.getElementById('off-security').value,
                description: document.getElementById('off-desc').value,
                images: document.getElementById('off-images').value.split('\n').map(x => x.trim()).filter(x => x)
            };

            await fetch('/api/admin-add-official', {
                method: 'POST',
                body: JSON.stringify({ password: pass, data: data })
            });
            alert("Official Listing Published!");
            e.target.reset();
            switchTab('manage');
            loadDashboard();
        });
    </script>
</body>
</html>
